[package]
name = "vv-secrets"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VideoVault secret store: OS-protected (DPAPI on Windows) blobs behind opaque references (SPEC §11.6, §20.3; ADR-0022)"

[dependencies]
uuid = { version = "=1.29.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3"
