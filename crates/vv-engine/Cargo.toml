[package]
name = "vv-engine"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VideoVault download engine: tool health, guarded yt-dlp runs, metadata, formats, downloads, storage moves and the job worker runtime (SPEC §13, §14, STATE.md F3)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = "=1.1.0"
vv-domain = { path = "../vv-domain" }
vv-persistence = { path = "../vv-persistence" }
vv-tools = { path = "../vv-tools" }
vv-ytdlp = { path = "../vv-ytdlp" }
vv-netguard = { path = "../vv-netguard" }
vv-process = { path = "../vv-process" }
vv-ffmpeg = { path = "../vv-ffmpeg" }
vv-import = { path = "../vv-import" }
vv-secrets = { path = "../vv-secrets" }
url = "2"
sha1 = "0.10"
sha2 = "0.10"
# Model downloads (F6.1, ADR-0026): blocking HTTPS with rustls; every
# address is vetted by vv-netguard's policy before it is used.
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"
