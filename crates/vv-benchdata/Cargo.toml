[package]
name = "vv-benchdata"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VideoVault versioned benchmark data generator and benchmark runner (SPEC NFR-01…07, DEC-17, §25.2; ADR-0009)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
vv-persistence = { path = "../vv-persistence" }

[lints]
workspace = true
