[workspace]
resolver = "2"
members = ["crates/vv-domain", "crates/vv-persistence", "crates/vv-ytdlp", "crates/vv-tools", "crates/vv-ffmpeg", "crates/vv-netguard", "crates/vv-process", "crates/vv-benchdata", "crates/vv-import", "crates/vv-engine", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

# Development builds (`npm run desktop`) hash every managed tool at start-up
# (about 400 MB) and every finished download: unoptimized SHA-256 took tens
# of seconds before any metadata job could start.
[profile.dev.package.sha2]
opt-level = 3
