[package]
name = "vv-desktop"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VideoVault desktop shell: Tauri 2 window and typed IPC commands"

[lib]
name = "vv_desktop"
path = "src/lib.rs"

[[bin]]
name = "videovault"
path = "src/main.rs"

[features]
# Test-only build used by apps/desktop/e2e-desktop (ADR-0001). Lets the E2E
# runner open a WebView2 debugging port on 127.0.0.1 via VV_E2E_CDP_PORT.
# Never enabled for the shipped executable.
e2e-cdp = []

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vv-domain = { path = "../../../crates/vv-domain" }
vv-persistence = { path = "../../../crates/vv-persistence" }
vv-import = { path = "../../../crates/vv-import" }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-dialog = "=2.8.4"
# Opens a file in the default player and a source page in the browser from
# Rust (PLAY-03/04). The webview gets no opener permission.
tauri-plugin-opener = { version = "=2.7.2", default-features = false }
# Free space of the media folder for the first run (§9.7).
fs4 = "=1.1.0"

[dev-dependencies]
tauri = { version = "=2.12.4", features = ["test"] }
tempfile = "3"
