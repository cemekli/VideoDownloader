[package]
name = "vv-desktop"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VideoVault desktop shell: Tauri 2 window and typed IPC commands"

[lib]
name = "vv_desktop"
path = "src/lib.rs"

[[bin]]
name = "videovault"
path = "src/main.rs"

[features]
# Test-only build used by apps/desktop/e2e-desktop (ADR-0001). Lets the E2E
# runner open a WebView2 debugging port on 127.0.0.1 via VV_E2E_CDP_PORT.
# Never enabled for the shipped executable.
e2e-cdp = []

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vv-domain = { path = "../../../crates/vv-domain" }
vv-persistence = { path = "../../../crates/vv-persistence" }

[dev-dependencies]
tauri = { version = "=2.12.4", features = ["test"] }
