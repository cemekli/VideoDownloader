name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the release target (SPEC §3); Linux keeps the domain crate portable.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/desktop ci
      - name: Install Playwright Chromium
        run: npx --prefix apps/desktop playwright install --with-deps chromium
      - name: Verify (all gates)
        run: node scripts/verify.mjs
        env:
          CI: "true"
      - name: Build desktop app (Windows, release, no installer)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx tauri build --no-bundle
      - name: Smoke test - app starts and stays up (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/release/videovault.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "videovault.exe exited early with code $($p.ExitCode)" }
          $w = Get-Process -Id $p.Id
          Write-Host "Running: $($w.ProcessName) pid=$($w.Id) window='$($w.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force
      - name: Upload desktop app (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: videovault-windows-x64
          path: target/release/videovault.exe
          retention-days: 14
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.os }}
          path: test-artifacts/
          retention-days: 14
