name: ci

# One run per change (docs/testing.md "CI ne zaman çalışır"):
# - Pull requests only. A merge to main is the same code the PR already
#   tested, so main is not run again.
# - Draft PRs are not run; marking the PR "Ready for review" runs it. Work in
#   progress is checked locally with `npm run verify`.
# - A new push cancels the older run of the same PR.
# - Changes to Markdown only (STATE, HANDOFF, docs) do not run CI.
# - "Run workflow" (workflow_dispatch) runs it by hand on any branch.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        # Windows is the release target (SPEC §3); Linux keeps the domain crate portable.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compiled dependencies even when a later step fails, so fixing a
          # failing test does not mean a 20-minute cold Tauri build each time.
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/desktop ci
      - name: Install Playwright Chromium
        run: npx --prefix apps/desktop playwright install --with-deps chromium
      # Downloads the pinned yt-dlp, Deno, FFmpeg and ffprobe (and whisper-cli with
      # its DLLs on Windows), checks hashes and yt-dlp's GPG signature, and runs
      # the health checks (ADR-0005, ADR-0006, ADR-0028).
      - name: Fetch and check managed tools
        run: node scripts/fetch-tools.mjs
      # Transcription model pins (F6.1, ADR-0026): the Hugging Face listing at the
      # pinned commit still gives the pinned SHA-256/size, and the Tiny model
      # downloaded end to end matches both that and whisper.cpp's published SHA-1.
      # Informational: a Hugging Face outage must not block the PR.
      - name: Model pins (Hugging Face, Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: node scripts/model-pins.mjs --download whisper-tiny
      # The real whisper-cli (Windows only; whisper.cpp has no Linux build) runs
      # once with the Tiny model in crates/vv-engine/tests/transcribe.rs (F6.2,
      # ADR-0028). Without the model (Hugging Face down) that test is skipped.
      - name: Tiny model for the real whisper-cli test (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: node scripts/model-pins.mjs --download whisper-tiny --save test-models
      # Real yt-dlp through the network guard: redirects, manifests and
      # segments aimed at a canary server must never reach it (ADR-0007, AC-29).
      - name: Network guard probe (real yt-dlp)
        run: node scripts/netguard-probe.mjs
      # Informational: CI machines are not the reference machine (ADR-0009), so
      # budgets are reported, not enforced. Writes test-artifacts/bench/.
      - name: Benchmark on generated data (BM-01…03)
        run: node scripts/bench.mjs
      # Built before verify so the real-app E2E step (e2e-desktop) can launch it.
      - name: Build E2E test app (Windows, feature e2e-cdp)
        if: runner.os == 'Windows'
        run: node scripts/build-e2e-exe.mjs
      # Built last so target/release/videovault.exe is the shipped build, without e2e-cdp.
      - name: Build desktop app (Windows, release, no installer)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx tauri build --no-bundle
      - name: Verify (all gates)
        run: node scripts/verify.mjs
        env:
          CI: "true"
          # On Windows the real-app E2E must run; a missing build is a failure, not a skip.
          VV_REQUIRE_DESKTOP_E2E: ${{ runner.os == 'Windows' && '1' || '0' }}
          VV_WHISPER_TEST_MODEL: ${{ runner.os == 'Windows' && hashFiles('test-models/ggml-tiny.bin') != '' && format('{0}/test-models/ggml-tiny.bin', github.workspace) || '' }}
      - name: Upload desktop app (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: videovault-windows-x64
          path: target/release/videovault.exe
          retention-days: 14
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.os }}
          path: test-artifacts/
          retention-days: 14
