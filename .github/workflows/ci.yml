name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the release target (SPEC §3); Linux keeps the domain crate portable.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/desktop ci
      - name: Install Playwright Chromium
        run: npx --prefix apps/desktop playwright install --with-deps chromium
      # Built before verify so the real-app E2E step (e2e-desktop) can launch it.
      - name: Build desktop app (Windows, release, no installer)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx tauri build --no-bundle
      - name: Verify (all gates)
        run: node scripts/verify.mjs
        env:
          CI: "true"
          # On Windows the real-app E2E must run; a missing build is a failure, not a skip.
          VV_REQUIRE_DESKTOP_E2E: ${{ runner.os == 'Windows' && '1' || '0' }}
      - name: Upload desktop app (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: videovault-windows-x64
          path: target/release/videovault.exe
          retention-days: 14
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.os }}
          path: test-artifacts/
          retention-days: 14
